# ═══════════════════════════════════════════════════════════
#  nginx конфиг для vzmakh.su → порт 8001
#  Файл: /etc/nginx/sites-available/vzmakh-chat
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name vzmakh.su www.vzmakh.su;

    # Редирект HTTP → HTTPS (после получения сертификата)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vzmakh.su www.vzmakh.su;

    # SSL (certbot auto-fill)
    ssl_certificate     /etc/letsencrypt/live/vzmakh.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vzmakh.su/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Gzip сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;

    # Заголовки безопасности
    add_header X-Frame-Options       "SAMEORIGIN";
    add_header X-XSS-Protection      "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy        "strict-origin-when-cross-origin";

    # Проксирование на Node.js приложение
    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade      $http_upgrade;
        proxy_set_header   Connection   'upgrade';
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Статика — кешировать агрессивно (Vite генерирует хеши)
    location ~* \.(js|css|woff2?|ico|png|jpg|svg|webp)$ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        expires            30d;
        add_header         Cache-Control "public, immutable";
        access_log         off;
    }

    # Логи
    access_log  /var/log/nginx/vzmakh-chat-access.log;
    error_log   /var/log/nginx/vzmakh-chat-error.log;
}
