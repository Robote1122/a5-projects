# ═══════════════════════════════════════════════════════════
#  nginx без SSL (только HTTP, для теста или certbot)
#  Файл: /etc/nginx/sites-available/vzmakh-chat
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name vzmakh.su www.vzmakh.su;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade      $http_upgrade;
        proxy_set_header   Connection   'upgrade';
        proxy_set_header   Host         $host;
        proxy_set_header   X-Real-IP    $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    access_log  /var/log/nginx/vzmakh-chat-access.log;
    error_log   /var/log/nginx/vzmakh-chat-error.log;
}
