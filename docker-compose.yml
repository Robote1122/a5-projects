version: '3.8'
# MDE5ZjFlZDUtMGQyYS03MDY2LThkMDgtZmY2MGMwNGNlODU5OjA0OTBlNGYzLTk0OGEtNDIzMS1iZWFhLTQzNWYxNzZjOTg4Yw==
services:
  # Node.js бэкенд + React фронтенд
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vzmakh-chat-backend
    ports:
      - "127.0.0.1:8001:8001"  # Только локально, не наружу
    environment:
      - GIGACHAT_AUTH_DATA=MDE5ZjFlZDUtMGQyYS03MDY2LThkMDgtZmY2MGMwNGNlODU5OjA0OTBlNGYzLTk0OGEtNDIzMS1iZWFhLTQzNWYxNzZjOTg4Yw
      - NODE_ENV=production
      - PORT=8001
      - AI_ENABLED=true
      - AI_SERVICE_URL=http://ai-service:8002
      - DB_PATH=/app/server/data/chat.db
    volumes:
      - ./server/data:/app/server/data
      - ./logs:/app/logs
    depends_on:
      - ai-service
    networks:
      - vzmakh-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Python AI сервис
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vzmakh-chat-ai
    ports:
      - "127.0.0.1:8002:8002"  # Только локально
    environment:
      - PORT=8002
      - GIGACHAT_AUTH_DATA=${GIGACHAT_AUTH_DATA}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-Embeddings}
      - DB_PATH=/app/data/safety_checklist_db
    volumes:
      - ./ai-service/data:/app/data
    networks:
      - vzmakh-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vzmakh-network:
    driver: bridge