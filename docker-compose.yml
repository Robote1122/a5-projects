version: '3.8'

services:
  # Node.js бэкенд + React фронтенд
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vzmakh-chat-backend
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=8001
      - AI_ENABLED=true
      - AI_SERVICE_URL=http://ai-service:8002
    volumes:
      - ./server/data:/app/server/data  # Персистентность БД
    depends_on:
      - ai-service
    networks:
      - vzmakh-network
    restart: unless-stopped

  # Python AI сервис
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vzmakh-chat-ai
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - GIGACHAT_AUTH_DATA=${GIGACHAT_AUTH_DATA}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-Embeddings}
      - DB_PATH=/app/data/safety_checklist_db
    volumes:
      - ./ai-service/data:/app/data  # Персистентность ChromaDB
    networks:
      - vzmakh-network
    restart: unless-stopped

  # Nginx (опционально, для продакшна)
  nginx:
    image: nginx:alpine
    container_name: vzmakh-chat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # SSL сертификаты
    depends_on:
      - backend
    networks:
      - vzmakh-network
    restart: unless-stopped

networks:
  vzmakh-network:
    driver: bridge