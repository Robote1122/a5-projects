version: '3.8'

services:
  # ============================================
  # POSTGRESQL БАЗА ДАННЫХ
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-chat_app}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ru_RU.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat_user} -d ${POSTGRES_DB:-chat_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # NODE.JS БЭКЕНД
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chat-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-chat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password_here}
      - POSTGRES_DATABASE=${POSTGRES_DB:-chat_app}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8002}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./server/data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # PYTHON AI СЕРВИС
  # ============================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: chat-ai
    restart: unless-stopped
    environment:
      - PORT=8002
      - GIGACHAT_AUTH_DATA=${GIGACHAT_AUTH_DATA}
      - GIGACHAT_EMBED_MODEL=${GIGACHAT_EMBED_MODEL:-Embeddings}
      - GIGACHAT_CHAT_MODEL=${GIGACHAT_CHAT_MODEL:-GigaChat}
      - DB_PATH=/app/data/safety_checklist_db
      - PROMPT_1_PATH=/app/prompts/prompt_start.txt
      - PROMPT_2_PATH=/app/prompts/prompt_continue.txt
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./ai-service/data:/app/data
      - ./ai-service/prompts:/app/prompts
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  app-network:
    driver: bridge